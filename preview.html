<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiClock - Interactive Windows 11 Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #fff;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        /* Top HUD / Toolbar */
        .hud-bar {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 20, 32, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 100;
            transition: opacity 0.3s, transform 0.3s;
        }
        .hud-bar:hover {
            border-color: rgba(0, 240, 255, 0.4);
        }
        .pill-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .pill-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: #00f0ff;
            color: #fff;
            transform: translateY(-1px);
        }
        .pill-btn.active {
            background: linear-gradient(135deg, #00f0ff, #ff007f);
            color: #050b14;
            border: none;
        }

        /* Bottom Floating Keyboard Hint */
        .shortcuts-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 24, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: #94a3b8;
            pointer-events: none;
            z-index: 90;
            letter-spacing: 0.5px;
        }
        .shortcuts-hint span {
            color: #00f0ff;
            font-weight: 700;
        }

        /* Drawer / Controls Modal */
        .controls-drawer {
            position: absolute;
            top: 70px;
            right: 20px;
            width: 320px;
            background: rgba(15, 22, 36, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 18px;
            display: none;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            z-index: 110;
        }
        .controls-drawer.open { display: flex; }
        .drawer-title {
            font-size: 15px;
            font-weight: 700;
            color: #00f0ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
        }
        .drawer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #cbd5e1;
        }
        select, input[type="text"], input[type="range"] {
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            font-size: 12px;
        }
        input[type="range"] { accent-color: #00f0ff; }
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 240, 255, 0.95);
            color: #0b0f19;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 200;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- Top Quick Control Bar -->
    <div class="hud-bar">
        <button class="pill-btn" onclick="cycleAnimation()">✨ <span id="animLabel">Starfield</span></button>
        <button class="pill-btn" onclick="cycleTheme()">🎨 <span id="themeLabel">Cyberpunk</span></button>
        <button class="pill-btn" onclick="toggleFormat24h()"><span id="formatLabel">12-Hour</span></button>
        <button class="pill-btn" onclick="toggleDrawer()">⚙️ Settings</button>
        <button class="pill-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>

    <!-- Interactive Drawer -->
    <div class="controls-drawer" id="drawer">
        <div class="drawer-title">
            <span>⚙️ Customization Panel</span>
            <button class="close-btn" onclick="toggleDrawer()">&times;</button>
        </div>
        <div class="drawer-row">
            <span>Animation Mode</span>
            <select id="selAnim" onchange="setAnimation(this.value)">
                <option value="starfield">3D Starfield Warp</option>
                <option value="matrix">Digital Matrix Rain</option>
                <option value="particles">Floating Embers</option>
                <option value="waves">Neon Sine Waves</option>
                <option value="minimalist">Minimalist Pulse</option>
            </select>
        </div>
        <div class="drawer-row">
            <span>Color Palette</span>
            <select id="selTheme" onchange="setTheme(this.value)">
                <option value="cyberpunk">Cyberpunk Neon</option>
                <option value="matrix">Matrix Terminal</option>
                <option value="synthwave">Synthwave Sunset</option>
                <option value="midnight">Midnight Ice</option>
                <option value="amber">Retro Amber CRT</option>
                <option value="sakura">Sakura Bloom</option>
                <option value="emerald">Emerald Forest</option>
                <option value="oled_dark">Minimalist OLED</option>
            </select>
        </div>
        <div class="drawer-row">
            <span>Show Seconds</span>
            <input type="checkbox" id="chkSec" checked onchange="config.showSeconds = this.checked">
        </div>
        <div class="drawer-row">
            <span>Blinking Colon</span>
            <input type="checkbox" id="chkBlink" checked onchange="config.blinkColon = this.checked">
        </div>
        <div class="drawer-row">
            <span>Glow Aura</span>
            <input type="checkbox" id="chkGlow" checked onchange="config.glow = this.checked">
        </div>
        <div class="drawer-row">
            <span>Speed: <b id="spdVal">1.0x</b></span>
            <input type="range" min="0.2" max="3.0" step="0.1" value="1.0" oninput="setSpeed(this.value)">
        </div>
        <div class="drawer-row">
            <span>Night Dimmer: <b id="dimVal">100%</b></span>
            <input type="range" min="15" max="100" step="5" value="100" oninput="setBrightness(this.value)">
        </div>
        <div class="drawer-row" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <span>Custom Message:</span>
            <input type="text" style="width: 100%;" id="txtMsg" value="Raspberry Pi 3 • Smart Display" oninput="config.customMsg = this.value">
        </div>
    </div>

    <!-- Bottom Shortcut Legend -->
    <div class="shortcuts-hint">
        <span>[M]</span> Animation &nbsp;•&nbsp; <span>[C]</span> Theme &nbsp;•&nbsp; <span>[T]</span> 12/24h &nbsp;•&nbsp; <span>[S]</span> Seconds &nbsp;•&nbsp; <span>[B]</span> Dimmer &nbsp;•&nbsp; <span>[F]</span> Fullscreen
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const toast = document.getElementById('toast');

        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }

        // Color Palettes
        const THEMES = {
            cyberpunk: {
                name: "Cyberpunk Neon",
                bg: "#0b0814",
                primary: "#00f0ff",
                secondary: "#ff007f",
                date: "#ffe600",
                accent: "#ff007f",
                msg: "#a0a0c8",
                anim: ["#00f0ff", "#ff007f", "#ffe600", "#8c00ff", "#00ffaa"]
            },
            matrix: {
                name: "Matrix Terminal",
                bg: "#020a04",
                primary: "#00ff64",
                secondary: "#b4ffc8",
                date: "#00c846",
                accent: "#00ff64",
                msg: "#00aa3c",
                anim: ["#00ff64", "#00c83c", "#008c28", "#c8ffd8"]
            },
            synthwave: {
                name: "Synthwave Sunset",
                bg: "#0d0221",
                primary: "#ff2a85",
                secondary: "#05d9e8",
                date: "#ff8c00",
                accent: "#ffbe0b",
                msg: "#c896dc",
                anim: ["#ff2a85", "#05d9e8", "#ff8c00", "#a020f0", "#ffbe0b"]
            },
            midnight: {
                name: "Midnight Ice",
                bg: "#040812",
                primary: "#1e90ff",
                secondary: "#00e5ff",
                date: "#b0e0e6",
                accent: "#00e5ff",
                msg: "#78a0c8",
                anim: ["#1e90ff", "#00e5ff", "#64b4ff", "#c8f0ff"]
            },
            amber: {
                name: "Retro Amber CRT",
                bg: "#0c0700",
                primary: "#ffb000",
                secondary: "#ffd250",
                date: "#d28c00",
                accent: "#ffb000",
                msg: "#b47814",
                anim: ["#ffb000", "#ffc832", "#c88200", "#ffe678"]
            },
            sakura: {
                name: "Sakura Bloom",
                bg: "#120a0f",
                primary: "#ff69b4",
                secondary: "#ffb6c1",
                date: "#ffdae0",
                accent: "#ff69b4",
                msg: "#d2a0b4",
                anim: ["#ff69b4", "#ffb6c1", "#ffdce6", "#e682aa"]
            },
            emerald: {
                name: "Emerald Forest",
                bg: "#04120a",
                primary: "#00e676",
                secondary: "#69f0ae",
                date: "#ffd700",
                accent: "#00e676",
                msg: "#78be96",
                anim: ["#00e676", "#69f0ae", "#ffd700", "#00b45a"]
            },
            oled_dark: {
                name: "Minimalist OLED",
                bg: "#000000",
                primary: "#fafafa",
                secondary: "#a0a0a0",
                date: "#c8c8c8",
                accent: "#ffffff",
                msg: "#787878",
                anim: ["#fafafa", "#b4b4b4", "#787878", "#505050"]
            }
        };

        const THEME_KEYS = Object.keys(THEMES);
        const ANIM_KEYS = ["starfield", "matrix", "particles", "waves", "minimalist"];

        // State Config
        const config = {
            theme: "cyberpunk",
            anim: "starfield",
            format24h: false,
            showSeconds: true,
            blinkColon: true,
            glow: true,
            speed: 1.0,
            brightness: 100,
            customMsg: "Raspberry Pi 3 • Smart Display"
        };

        let width = 0, height = 0;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStarfield();
            initMatrix();
            initParticles();
        }
        window.addEventListener('resize', resize);

        // ================= ANIMATION: STARFIELD =================
        let stars = [];
        function initStarfield() {
            stars = [];
            const count = Math.min(130, Math.floor(width * 0.1));
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * width * 2,
                    y: (Math.random() - 0.5) * height * 2,
                    z: Math.random() * 1000 + 1,
                    pz: 1000,
                    color: THEMES[config.theme].anim[Math.floor(Math.random() * THEMES[config.theme].anim.length)]
                });
            }
        }
        function drawStarfield(dt) {
            const cx = width / 2;
            const cy = height / 2;
            const fov = width * 0.7;
            const speed = 360 * config.speed * dt;

            for (let s of stars) {
                s.pz = s.z;
                s.z -= speed;
                if (s.z <= 1) {
                    s.x = (Math.random() - 0.5) * width * 2;
                    s.y = (Math.random() - 0.5) * height * 2;
                    s.z = 1000;
                    s.pz = 1000;
                    s.color = THEMES[config.theme].anim[Math.floor(Math.random() * THEMES[config.theme].anim.length)];
                }

                const sx = (s.x / s.z) * fov + cx;
                const sy = (s.y / s.z) * fov + cy;
                const px = (s.x / s.pz) * fov + cx;
                const py = (s.y / s.pz) * fov + cy;

                if (sx < 0 || sx > width || sy < 0 || sy > height) continue;

                const factor = Math.max(0, Math.min(1, 1 - (s.z / 1000)));
                ctx.strokeStyle = s.color;
                ctx.fillStyle = s.color;
                ctx.globalAlpha = factor;

                if (factor > 0.35) {
                    ctx.lineWidth = Math.max(1, factor * 3);
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(sx, sy);
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(sx, sy, Math.max(1, factor * 3.5), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // ================= ANIMATION: MATRIX =================
        const CHARS = "0123456789ABCDEF!@#$%*+-=<>~";
        let matrixCols = [];
        function initMatrix() {
            matrixCols = [];
            const colWidth = 22;
            const numCols = Math.floor(width / colWidth);
            for (let i = 0; i < numCols; i++) {
                matrixCols.push({
                    x: i * colWidth,
                    y: Math.random() * -height,
                    speed: (Math.random() * 120 + 90),
                    chars: Array.from({length: Math.floor(Math.random() * 12 + 6)}, () => CHARS[Math.floor(Math.random() * CHARS.length)]),
                    timer: Math.random() * 0.2
                });
            }
        }
        function drawMatrix(dt) {
            ctx.font = "bold 18px 'JetBrains Mono', monospace";
            const rowHeight = 22;
            const theme = THEMES[config.theme];
            const baseColor = theme.anim[0];

            for (let col of matrixCols) {
                col.y += col.speed * config.speed * dt;
                col.timer -= dt;
                if (col.timer <= 0) {
                    col.timer = Math.random() * 0.15 + 0.05;
                    const idx = Math.floor(Math.random() * col.chars.length);
                    col.chars[idx] = CHARS[Math.floor(Math.random() * CHARS.length)];
                }

                if (col.y - (col.chars.length * rowHeight) > height) {
                    col.y = Math.random() * -100;
                    col.speed = (Math.random() * 120 + 90);
                }

                for (let i = 0; i < col.chars.length; i++) {
                    const gy = col.y - (i * rowHeight);
                    if (gy < -20 || gy > height) continue;

                    if (i === 0) {
                        ctx.fillStyle = "#ffffff";
                        ctx.globalAlpha = 1;
                    } else {
                        ctx.fillStyle = baseColor;
                        ctx.globalAlpha = Math.max(0.1, 1 - (i / col.chars.length));
                    }
                    ctx.fillText(col.chars[i], col.x, gy);
                }
            }
            ctx.globalAlpha = 1;
        }

        // ================= ANIMATION: PARTICLES =================
        let particles = [];
        function initParticles() {
            particles = [];
            const count = Math.min(80, Math.floor(width * 0.06));
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 30,
                    vy: -(Math.random() * 30 + 15),
                    radius: Math.random() * 4 + 2,
                    phase: Math.random() * Math.PI * 2,
                    color: THEMES[config.theme].anim[Math.floor(Math.random() * THEMES[config.theme].anim.length)]
                });
            }
        }
        function drawParticles(dt) {
            for (let p of particles) {
                p.phase += 1.5 * config.speed * dt;
                p.x += (p.vx + Math.sin(p.phase) * 20) * dt * config.speed;
                p.y += p.vy * dt * config.speed;

                if (p.y < -20) { p.y = height + 10; p.x = Math.random() * width; }
                if (p.x < -20) p.x = width + 10;
                if (p.x > width + 20) p.x = -10;

                ctx.fillStyle = p.color;
                // Outer glow
                ctx.globalAlpha = 0.25;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * 2.5, 0, Math.PI * 2);
                ctx.fill();

                // Core
                ctx.globalAlpha = 0.85;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // ================= ANIMATION: WAVES =================
        let waveTime = 0;
        function drawWaves(dt) {
            waveTime += dt * config.speed * 1.3;
            const midY = height * 0.58;
            const theme = THEMES[config.theme];
            const ribbons = [
                { freq: 0.005, amp: height * 0.12, mult: 1.0, color: theme.anim[0], width: 3, alpha: 0.7 },
                { freq: 0.008, amp: height * 0.09, mult: -1.4, color: theme.anim[1] || theme.anim[0], width: 2, alpha: 0.5 },
                { freq: 0.003, amp: height * 0.16, mult: 0.7, color: theme.anim[2] || theme.anim[0], width: 4, alpha: 0.4 }
            ];

            for (let r of ribbons) {
                ctx.strokeStyle = r.color;
                ctx.lineWidth = r.width;
                ctx.globalAlpha = r.alpha;
                ctx.beginPath();

                for (let x = 0; x <= width + 15; x += 15) {
                    const y = midY + Math.sin(x * r.freq + waveTime * r.mult) * r.amp +
                                    Math.cos(x * r.freq * 0.5 + waveTime * 0.8) * (r.amp * 0.4);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        // ================= ANIMATION: MINIMALIST =================
        let pulseTime = 0;
        function drawMinimalist(dt) {
            pulseTime += dt * config.speed * 1.5;
            const cx = width / 2;
            const cy = height / 2;
            const breath = (Math.sin(pulseTime) + 1) / 2;
            const radius = Math.min(width, height) * 0.38 + breath * 15;
            const theme = THEMES[config.theme];

            ctx.strokeStyle = theme.accent;
            ctx.globalAlpha = 0.2 + breath * 0.25;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.globalAlpha = 0.1 + breath * 0.1;
            ctx.beginPath();
            ctx.arc(cx, cy, radius + 25, 0, Math.PI * 2);
            ctx.stroke();

            // Hairline
            const lineY = height * 0.72;
            const lineW = width * (0.4 + breath * 0.1);
            ctx.globalAlpha = 0.3 + breath * 0.3;
            ctx.beginPath();
            ctx.moveTo(cx - lineW / 2, lineY);
            ctx.lineTo(cx + lineW / 2, lineY);
            ctx.stroke();

            ctx.globalAlpha = 1;
        }

        // ================= CLOCK & TEXT RENDERER =================
        function drawClock() {
            const now = new Date();
            const theme = THEMES[config.theme];

            // 1. Time Format
            let hours = now.getHours();
            let ampm = "";
            if (!config.format24h) {
                ampm = hours >= 12 ? "PM" : "AM";
                hours = hours % 12;
                if (hours === 0) hours = 12;
            } else {
                hours = hours.toString().padStart(2, "0");
            }
            const mins = now.getMinutes().toString().padStart(2, "0");
            const secs = now.getSeconds().toString().padStart(2, "0");

            const colon = (config.blinkColon && now.getMilliseconds() < 500) ? " " : ":";
            const timeStr = `${hours}${colon}${mins}`;

            // Scale fonts
            const baseSize = Math.max(36, Math.floor(height * 0.25));
            const secSize = Math.floor(baseSize * 0.50);
            const ampmSize = Math.floor(baseSize * 0.36);
            const dateSize = Math.max(14, Math.floor(height * 0.065));
            const msgSize = Math.max(12, Math.floor(height * 0.045));

            ctx.font = `800 ${baseSize}px 'JetBrains Mono', monospace`;
            ctx.textBaseline = "middle";

            const timeMetrics = ctx.measureText(timeStr);
            const timeW = timeMetrics.width;

            // Measure extra space for seconds & AM/PM
            ctx.font = `700 ${secSize}px 'JetBrains Mono', monospace`;
            const secMetrics = ctx.measureText(" 00");
            const extraW = config.showSeconds || ampm ? secMetrics.width : 0;
            const totalW = timeW + extraW;

            const startX = (width - totalW) / 2;
            const centerY = height * 0.40;

            // Glow styling
            if (config.glow) {
                ctx.shadowColor = theme.primary;
                ctx.shadowBlur = 18;
            } else {
                ctx.shadowBlur = 0;
            }

            // Draw Time
            ctx.fillStyle = theme.primary;
            ctx.font = `800 ${baseSize}px 'JetBrains Mono', monospace`;
            ctx.fillText(timeStr, startX, centerY);

            // Draw Seconds & AM/PM
            const rightX = startX + timeW + 10;
            if (config.glow) ctx.shadowColor = theme.secondary;

            if (config.showSeconds && ampm) {
                ctx.font = `700 ${secSize}px 'JetBrains Mono', monospace`;
                ctx.fillStyle = theme.secondary;
                ctx.fillText(secs, rightX, centerY - baseSize * 0.18);

                ctx.font = `700 ${ampmSize}px 'JetBrains Mono', monospace`;
                ctx.fillStyle = theme.accent;
                ctx.fillText(ampm, rightX, centerY + baseSize * 0.22);
            } else if (config.showSeconds) {
                ctx.font = `700 ${secSize}px 'JetBrains Mono', monospace`;
                ctx.fillStyle = theme.secondary;
                ctx.fillText(secs, rightX, centerY);
            } else if (ampm) {
                ctx.font = `700 ${ampmSize}px 'JetBrains Mono', monospace`;
                ctx.fillStyle = theme.accent;
                ctx.fillText(ampm, rightX, centerY);
            }

            // 2. Date String
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('en-US', options);

            ctx.font = `500 ${dateSize}px 'Plus Jakarta Sans', sans-serif`;
            ctx.textAlign = "center";
            if (config.glow) ctx.shadowColor = theme.date;
            ctx.fillStyle = theme.date;
            ctx.fillText(dateStr, width / 2, height * 0.60);

            // 3. Custom Subtitle
            if (config.customMsg) {
                ctx.shadowBlur = 0;
                ctx.font = `italic 500 ${msgSize}px 'Plus Jakarta Sans', sans-serif`;
                ctx.fillStyle = theme.msg;
                ctx.fillText(config.customMsg, width / 2, height * 0.78);
            }

            ctx.textAlign = "start"; // Reset
            ctx.shadowBlur = 0;

            // 4. Night Dimmer
            if (config.brightness < 100) {
                const alpha = (1 - (config.brightness / 100));
                ctx.fillStyle = `rgba(0,0,0,${alpha})`;
                ctx.fillRect(0, 0, width, height);
            }
        }

        // ================= MAIN LOOP =================
        let lastTime = performance.now();
        function loop(now) {
            const dt = Math.min(0.1, (now - lastTime) / 1000);
            lastTime = now;

            // Fill background
            ctx.fillStyle = THEMES[config.theme].bg;
            ctx.fillRect(0, 0, width, height);

            // Render active animation
            if (config.anim === "starfield") drawStarfield(dt);
            else if (config.anim === "matrix") drawMatrix(dt);
            else if (config.anim === "particles") drawParticles(dt);
            else if (config.anim === "waves") drawWaves(dt);
            else if (config.anim === "minimalist") drawMinimalist(dt);

            // Render clock & typography
            drawClock();

            requestAnimationFrame(loop);
        }

        // ================= CONTROLS & INTERACTIONS =================
        function cycleAnimation() {
            const idx = ANIM_KEYS.indexOf(config.anim);
            config.anim = ANIM_KEYS[(idx + 1) % ANIM_KEYS.length];
            document.getElementById('animLabel').textContent = config.anim.charAt(0).toUpperCase() + config.anim.slice(1);
            document.getElementById('selAnim').value = config.anim;
            showToast("Animation: " + config.anim.toUpperCase());
        }

        function cycleTheme() {
            const idx = THEME_KEYS.indexOf(config.theme);
            config.theme = THEME_KEYS[(idx + 1) % THEME_KEYS.length];
            document.getElementById('themeLabel').textContent = THEMES[config.theme].name.split(' ')[0];
            document.getElementById('selTheme').value = config.theme;
            initStarfield();
            initParticles();
            showToast("Theme: " + THEMES[config.theme].name);
        }

        function setAnimation(name) {
            config.anim = name;
            document.getElementById('animLabel').textContent = name.charAt(0).toUpperCase() + name.slice(1);
            showToast("Animation: " + name.toUpperCase());
        }

        function setTheme(key) {
            config.theme = key;
            document.getElementById('themeLabel').textContent = THEMES[key].name.split(' ')[0];
            initStarfield();
            initParticles();
            showToast("Theme: " + THEMES[key].name);
        }

        function toggleFormat24h() {
            config.format24h = !config.format24h;
            document.getElementById('formatLabel').textContent = config.format24h ? "24-Hour" : "12-Hour";
            showToast(config.format24h ? "24-Hour Time" : "12-Hour Time");
        }

        function cycleBrightness() {
            const steps = [100, 75, 50, 25];
            const idx = steps.indexOf(config.brightness);
            config.brightness = steps[(idx + 1) % steps.length];
            document.getElementById('dimVal').textContent = config.brightness + "%";
            showToast("Brightness: " + config.brightness + "%");
        }

        function setSpeed(val) {
            config.speed = parseFloat(val);
            document.getElementById('spdVal').textContent = config.speed.toFixed(1) + "x";
        }

        function setBrightness(val) {
            config.brightness = parseInt(val);
            document.getElementById('dimVal').textContent = config.brightness + "%";
        }

        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('open');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        // Tap gestures: click top half = cycle animation, bottom half = cycle theme
        canvas.addEventListener('click', (e) => {
            if (e.clientY < height * 0.5) cycleAnimation();
            else cycleTheme();
        });

        // Keyboard hotkeys
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'm') cycleAnimation();
            else if (key === 'c') cycleTheme();
            else if (key === 't') toggleFormat24h();
            else if (key === 's') {
                config.showSeconds = !config.showSeconds;
                document.getElementById('chkSec').checked = config.showSeconds;
                showToast("Seconds: " + (config.showSeconds ? "ON" : "OFF"));
            }
            else if (key === 'b') cycleBrightness();
            else if (key === 'f') toggleFullscreen();
            else if (key === 'escape') document.getElementById('drawer').classList.remove('open');
        });

        // Initialize
        resize();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
